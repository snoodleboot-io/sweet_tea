[lint]
# Enable import sorting rules
select = ["E", "F", "I"]  # Include import sorting (I rules)
ignore = ["E501"]  # Ignore line too long errors

[lint.isort]
# Configure import sorting to be compatible with black
force-single-line = false
force-sort-within-sections = false
lines-after-imports = 2
known-first-party = ["sweet_tea"]
order-by-type = true
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[lint.per-file-ignores]
# Fixtures for lazy registration (SWE-10). Each module is deliberately written in a
# shape that defeats or stresses static discovery — unused and re-exported imports,
# a name redefined, imports below code, a dependency that is not installed. Linting
# them away would delete the cases under test, and CI runs `ruff check . --fix`.
"tests/lazy_cases/*" = ["E402", "F401", "F811", "I001"]
"tests/lazy_broken/*" = ["I001"]
# Concurrency scenarios (SWE-22). Each is a standalone script run in a
# subprocess, so it must put the repo on sys.path before importing sweet_tea,
# and the deliberate import order is the point rather than an oversight.
"tests/concurrency_scripts/*" = ["E402", "I001"]
# Provenance fixtures (SWE-20): each module is written in the shape whose
# discovery behaviour is under test.
"tests/provenance_cases/*" = ["E402", "F401", "I001"]
# Audit fixtures: each module is written in a shape the audit must flag.
"tests/lazy_audit_cases/*" = ["E402", "F401", "I001"]
